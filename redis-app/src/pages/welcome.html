<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redis Auth</title>
  <style>

  </style>
</head>
<body>

    <div>
      <button id="logout">logout</button>
      <div id="welcome"></div>
    </div>

  <script>

    // requirePageAuth and refresh route do roughly the same thing. 
    // -- requirePageAuth redirects user based on if they're authenticated
    // -- /refresh mints a new jwt if the refresh key checks out; triggered by a 401 from this route (/me here)

    async function loadMe() {
        try {
            const response = await fetch ("http://localhost:3000/me")
            if (!response.ok) {
                const refreshResponse = await fetch("http://localhost:3000/refresh")
                if (!refreshResponse.ok) {
                    location.href = "/index.html"
                    return
                }
                return loadMe()
            }
            const data = await response.json()
            console.log(data)
            const welcome = document.getElementById("welcome")
            if (welcome) {
                welcome.textContent = `Welcome, ${data.username}`
            }
            
        } catch (err) {
            console.log(err)
        }
    }
    loadMe()

    if (logout) {
        logout.addEventListener("click", function(e) {

            e.preventDefault()

            async function logoutUser() {
                try {
                    const response = await fetch("http://localhost:3000/logout", {
                        method: "DELETE",
                        credentials: "include",
                    })
                } catch(e) {
                    console.error(e.message)
                } finally {
                    location.href = "/index.html"
                }
            }

            logoutUser()
        })
    }

  </script>
</body>
</html>
